<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş | Kick AutoMod</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-main);
            font-family: 'Inter', sans-serif;
        }
        .access-container {
            background: var(--bg-elevated);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--border);
        }
        .access-container h1 {
            color: var(--text-1);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .access-container p {
            color: var(--text-2);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-hover);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-md);
            color: var(--text-1);
            font-size: 1rem;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(83, 252, 24, 0.2);
        }
        .btn-submit {
            background: var(--primary);
            color: var(--bg-main);
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(83, 252, 24, 0.3);
        }
        .error-msg {
            color: var(--danger);
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="access-container">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--primary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1.5rem;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h1>Özel Erişim Kodu</h1>
        <p>Sisteme giriş yapabilmek için lütfen davet kodunuzu girin.</p>
        
        <form id="accessForm">
            <div class="input-group">
                <input type="password" id="accessCode" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sisteme Gir</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('accessCode').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/auth/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Geçersiz kod';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Bir hata oluştu. Lütfen tekrar deneyin.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
