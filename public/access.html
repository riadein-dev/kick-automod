<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş | Kick AutoMod</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #06060a;
            font-family: 'Inter', sans-serif;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* Background Effects */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(0, 232, 123, 0.15), transparent 70%); top: 10%; left: 20%; animation: float1 10s ease-in-out infinite alternate; }
        .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(56, 189, 248, 0.1), transparent 70%); bottom: 20%; right: 10%; animation: float2 12s ease-in-out infinite alternate; }

        @keyframes float1 { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, -20px); } }
        @keyframes float2 { 0% { transform: translate(0, 0); } 100% { transform: translate(-20px, 30px); } }

        .access-container {
            background: rgba(10, 10, 16, 0.6);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 10;
        }
        .access-container::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
            background: linear-gradient(135deg, rgba(0, 232, 123, 0.2), transparent 50%, rgba(56, 189, 248, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        .access-container h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .access-container p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 4px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00e87b;
            background: rgba(0, 232, 123, 0.05);
            box-shadow: 0 0 0 3px rgba(0, 232, 123, 0.1);
        }
        .btn-submit {
            background: linear-gradient(135deg, #00e87b, #34d399);
            color: #000;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 24px rgba(0, 232, 123, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 32px rgba(0, 232, 123, 0.4);
        }
        .error-msg {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .contact-admin {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        .contact-admin span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="access-container">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="#00e87b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; filter: drop-shadow(0 0 10px rgba(0,232,123,0.4));">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h1>Özel Erişim Kodu</h1>
        <p>Sisteme giriş yapabilmek için lütfen davet kodunuzu girin.</p>
        
        <form id="accessForm">
            <div class="input-group">
                <input type="password" id="accessCode" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sisteme Gir</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="contact-admin">
            Kod almak için yöneticiyle iletişime geçiniz<br>
            Discord: <span>Riadein_</span>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('accessCode').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/auth/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Geçersiz kod';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Bir hata oluştu. Lütfen tekrar deneyin.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
