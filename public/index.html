<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick AutoMod - Giriş</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #111111 100%);
            overflow: hidden;
        }

        .login-container {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(83, 252, 24, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(83, 252, 24, 0.05);
            position: relative;
            z-index: 10;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #53FC18;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-weight: 800;
            font-size: 2rem;
            color: #000;
            box-shadow: 0 0 30px rgba(83, 252, 24, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        p {
            color: #a1a1a1;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .btn-kick {
            background: #53FC18;
            color: #000;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-kick:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(83, 252, 24, 0.2);
            background: #4ade80;
        }

        .btn-kick svg {
            width: 24px;
            height: 24px;
        }

        .btn-kick::after {
            content: "Tamamen Güvendesin!";
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #000;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(83, 252, 24, 0.3);
            white-space: nowrap;
            pointer-events: none;
        }

        .btn-kick:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Snow Effect */
        .snow {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: fall linear forwards;
            z-index: 0;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
            }
        }

        /* Animated background elements */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(83,252,24,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            animation: pulse 8s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .error-message {
            background: rgba(251, 44, 54, 0.1);
            border: 1px solid rgba(251, 44, 54, 0.3);
            color: #ff5252;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="login-container">
        <div class="logo">K</div>
        <h1>AutoMod Dashboard</h1>
        <p>Moderasyon kontrol merkezi için Kick hesabınızla giriş yapın.</p>
        
        <div id="errorBox" class="error-message"></div>

        <a href="/auth/login" class="btn-kick">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <!-- Authentic Kick Logo blocky K -->
                <rect x="4" y="3" width="4" height="18" />
                <rect x="8" y="9" width="4" height="6" />
                <rect x="12" y="3" width="4" height="6" />
                <rect x="12" y="15" width="4" height="6" />
            </svg>
            Kick ile Giriş Yap
        </a>
    </div>

    <script>
        // Check for error parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            let msg = 'Giriş başarısız oldu.';
            if (error === 'token_exchange_failed') msg = 'Token alınamadı. Client ID/Secret hatalı olabilir.';
            else if (error === 'state_mismatch') msg = 'Güvenlik doğrulaması başarısız.';
            errorBox.textContent = msg;
        }

        // Check if already authenticated
        fetch('/auth/me')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/dashboard.html';
                }
            })
            .catch(console.error);

        // Snow effect
        function createSnowflake() {
            const snow = document.createElement('div');
            snow.classList.add('snow');
            // Random horizontal position
            snow.style.left = Math.random() * 100 + 'vw';
            // Random size between 2px and 6px
            const size = Math.random() * 4 + 2;
            snow.style.width = size + 'px';
            snow.style.height = size + 'px';
            // Random fall duration between 3s and 6s
            snow.style.animationDuration = Math.random() * 3 + 3 + 's';
            // Random opacity
            snow.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(snow);

            // Remove after it finishes falling
            setTimeout(() => {
                snow.remove();
            }, 6000);
        }
        
        // Spawn a snowflake every 100ms
        setInterval(createSnowflake, 100);
    </script>
</body>
</html>
